cargo-features = ["edition2024"]

[package]
name = "blueshit_anchor_escrow"
version = "0.1.0"
description = "Created with Anchor"
edition = "2024"  # This requires nightly and edition2024 opt-in

[lib]
crate-type = ["cdylib", "lib"]
name = "blueshit_anchor_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
